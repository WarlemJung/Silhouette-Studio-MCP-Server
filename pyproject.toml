[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silhouette-studio-mcp"
version = "1.0.0"
description = "Production-ready Model Context Protocol (MCP) server for preparing vector cut designs (DXF/SVG/PNG) for Silhouette Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Warlem Jung" }
]
keywords = ["mcp", "silhouette-studio", "silhouette-cameo", "dxf", "cutting-plotter", "vector"]
dependencies = [
    "ezdxf>=1.4.0",
    "fonttools>=4.40.0",
    "mcp>=1.3.0",
    "Pillow>=10.0.0",
    "svgelements>=1.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
silhouette-studio-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
