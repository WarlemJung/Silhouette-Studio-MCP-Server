[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silhouette-studio-mcp"
version = "1.1.0"
description = "Production-ready Model Context Protocol (MCP) server for preparing vector cut designs (DXF/SVG/PNG) for Silhouette Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Warlem Jung" }
]
keywords = ["mcp", "silhouette-studio", "silhouette-cameo", "dxf", "cutting-plotter", "vector"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based"
]
dependencies = [
    "defusedxml>=0.7.1",
    "ezdxf>=1.4.0",
    "fonttools>=4.40.0",
    "mcp>=1.3.0",
    "Pillow>=10.0.0",
    "svgelements>=1.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/WarlemJung/Silhouette-Studio-MCP-Server"
Repository = "https://github.com/WarlemJung/Silhouette-Studio-MCP-Server"
Issues = "https://github.com/WarlemJung/Silhouette-Studio-MCP-Server/issues"

[project.scripts]
silhouette-studio-mcp = "silhouette_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["silhouette_mcp"]

[tool.coverage.report]
fail_under = 92
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
